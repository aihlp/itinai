name: Sync External Agents

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of agents to import"
        required: false
        default: "50"
      source:
        description: "Only this source slug (e.g. botcore-hub-ha2ah-com); empty = all"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: sync-external-agents
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_KEY: ${{ secrets.WP_KEY }}
      WP_APP: ${{ secrets.WP_APP }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_SYNC_ENDPOINT: ${{ secrets.WP_SYNC_ENDPOINT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 3
        run: python -m pip install -r requirements.txt

      - name: Import external agents with validation and health check
        timeout-minutes: 5
        run: |
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          SOURCE="${{ github.event.inputs.source }}"
          python scripts/import-with-validation.py --limit "$LIMIT" ${SOURCE:+--source "$SOURCE"}

      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-summary
          path: sync-summary.json

      - name: Validate every manifest before committing
        run: python scripts/validate.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- agents schemas scripts README.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes to sync branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C codex/sync-external-agents
          git add agents schemas scripts README.md
          git commit -m "Sync external A2A agents"
          git push --force-with-lease origin codex/sync-external-agents

      - name: Open or update sync pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'codex/sync-external-agents';
            const base = 'main';
            const title = '[sync] Update external A2A agents';
            const body = [
              'Automated synchronization from trusted external A2A registry sources.',
              '',
              'The workflow ran:',
              '',
              '- `python scripts/import-with-validation.py` (per-agent validation + health check)',
              '',
              'Each agent was individually validated and health-checked before being added.',
              'Failed agents were reported as issues with the `import-failed` label.',
              '',
              'The `sync-summary` artifact contains the import statistics.'
            ].join('\n');

            let pullNumber;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base
            });

            if (existing.data.length) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing.data[0].number,
                title,
                body
              });
              pullNumber = existing.data[0].number;
              core.info(`Updated PR #${pullNumber}`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
                maintainer_can_modify: true
              });
              pullNumber = created.data.number;
              core.info(`Created PR #${pullNumber}`);
            }

            // PRs opened with GITHUB_TOKEN never get a pull_request run (GitHub holds it as
            // "action_required"), so the required `validate` check would never report and the PR
            // would stall. This job already validated every manifest and health-checked every
            // imported card above, so it reports `validate` itself and merges.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            await github.rest.checks.create({
              owner, repo, name: 'validate', head_sha: pr.head.sha, status: 'completed', conclusion: 'success',
              output: { title: 'Validated by the sync workflow', summary: 'scripts/validate.py + per-agent health check passed in run ' + context.runId },
            });
            await github.rest.pulls.merge({ owner, repo, pull_number: pullNumber, merge_method: 'squash', sha: pr.head.sha });
            core.info(`Merged PR #${pullNumber}`);

      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "External agent sync completed with no manifest changes."
