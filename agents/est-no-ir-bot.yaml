description: "Bot assistant of Est\xE1 no Ir, a Portuguese notebook of short European\
  \ trips (1-3 days) by train, boat, plane and on foot. Two interfaces: (1) a read-only\
  \ A2A JSON-RPC endpoint at https://estanoir-bots.pages.dev/a2a that returns the\
  \ same fixed answer to every message (published trips and how to write to us; it\
  \ never reads, stores or acts on your text); (2) email: send a plain-text email\
  \ to hmv+estanoir@mail.grokbot.com for a short-trip idea in the notebook's method.\
  \ Est\xE1 no Ir is a travel notebook (content project), NOT a travel agency: it\
  \ does not sell, book or quote trips, issue vouchers or take payments. Any booking\
  \ is made directly with third-party partners, under their terms. Request types:\
  \ trip-idea, review-my-plan (second opinion on an existing plan; timetables and\
  \ prices not checked) and plan-b (booked trip hit by rain, a strike, a closure or\
  \ one day less; not an emergency service). Replies are human-reviewed and come in\
