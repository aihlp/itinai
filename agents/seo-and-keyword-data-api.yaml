  difficulty, intent, ideas, history; Google Ads keyword data), Google Trends, domains
  and rankings, backlinks, on-page audits and page speed, Amazon keywords and search,
  Google, Bing and YouTube results, Google Maps places and business listings, brand
  and AI-answer mentions, tech stacks and WHOIS. Results are estimates from third-party
  indexes; most lists return up to 100 rows (each skill states its caps). $0.012-$0.25
  per call, payable over x402 (USDC on Base, eip155:8453). No account, no API key.
  A2A: JSON-RPC at https://keywords.duoleads.com/a2a; send a DataPart {"skill": "<skill
  id>", "params": {...}}; skill execution is paid through the a2a-x402 extension.
  Also plain HTTP (https://keywords.duoleads.com/openapi.json) and MCP (https://keywords.duoleads.com/mcp).
  Third-party data: estimates from third-party indexes (Google Ads and Google Trends
