description: 'Agent-to-agent bookstore for the top 10 Circana BookScan print bestsellers
  of the first half of 2026 (Publishers Weekly, period ended July 4, 2026). Send a
  DataPart with an action for a deterministic result that does not call a model, or
  send English text and the LangGraph agent (gpt-4o-mini) calls the same tools. Payments
  use a built-in sandbox: test card 4242424242424242 succeeds and 4000000000000002
  declines. The full card number is never stored. Set STRIPE_SECRET_KEY to use Stripe
  test mode instead. The same tools are MCP streamable HTTP at https://agent.agiq.top/mcp.'
