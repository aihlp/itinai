description: 'A research desk for China''s tech sector: semiconductors, AI compute,
  robotics, advanced materials, new energy. Ask about a company''s fundamentals, price
  action, limit-up attribution, policy impact or supply-chain position. Everything
  is public and answers cite sources. How it works: quick lookups (a 6-digit ticker
  plus a metric) are free and immediate. Deep research questions need a ticket: submit
