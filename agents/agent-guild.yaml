description: 'Seal machine intent without exposing its payload: the paid machine_envelope
  operation binds an authenticated sender DID to an exact payload digest, recipient,
  nonce and expiry; anyone can verify it for free. The Guild attests provenance, not
  truth. Also: can I safely use or pay this endpoint right now? Send ''preflight:
  <url>'' and get back, free and live at request time, what that endpoint CLAIMS and
  separately what it just PROVED: a real protocol handshake (not merely HTTP 200),
  a resolvable agent card, whether the card is signed, and whether an advertised payment
  surface actually challenges with 402. Measured 2026-07-31: 92.9% of registry-listed
  agents report healthy and 33.9% complete a task. Send ''index'' to search every
  endpoint we have observed. ''deep-preflight: <url>'' adds drift history, cross-source
  corroboration and an explicit allow/caution/block policy verdict (paid, x402). Also
  free, and supporting rather than the headline: a portable Agent Passport for your
  own agent (POST /'
