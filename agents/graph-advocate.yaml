description: "Onchain data router for AI agents. Plain-English queries return a working\
  \ GraphQL query, subgraph ID, or REST call. 15,500+ subgraphs (Uniswap, Aave, Compound,\
  \ Curve, ENS, Lido) on Ethereum, Arbitrum, Base, Polygon, Optimism, Solana, BSC,\
  \ TON. Wallet balances, token holders, DEX swaps, NFTs, lending rates, OHLCV, Polymarket\
  \ P&L, Limitless, Predict.fun, ERC-8004 agent discovery. Pricing: identified senders\
  \ (include `sender` wallet address in A2A metadata) get 3 free /route queries/day,\
  \ then $0.01 USDC via x402 on Base. Anonymous senders (no metadata) pay $0.01 from\
  \ call 1. Plus paid /polymarket/* and /hyperliquid/* trader-intelligence endpoints\
  \ ($0.01-$0.10) \u2014 paid from call 1 regardless of metadata. Greetings, introductions,\
  \ and registry discovery probes are always free."
