description: 'Online store in Uzbekistan (birinchishop.uz). Products are delivered
  to all regions of Uzbekistan in 1-3 days and paid in cash to the courier on delivery;
  a 30 000 UZS delivery fee is added. This agent searches the catalog, shows product
  details and totals, checks order status and places cash-on-delivery orders only
  with the shopper''s explicit confirmation. Deterministic (no LLM): use structured
  data parts {"skill": "<id>", "arguments": {...}}; plain text is treated as a product
  search. Prices are integers in UZS.'
