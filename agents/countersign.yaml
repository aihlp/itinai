description: 'Signed check of AI work by code that did not make it (no AI model decides
  the result). Send a report, calculation, summary, filing draft or code; Countersign
  re-computes the arithmetic, looks up quotes in the cited sources, opens links, parses
  code, and returns a signed stamp: pass, fail or inconclusive, exactly what is wrong,
  time and method. Every stamp is in a public, verifiable log. It never checks work
  it produced.'
