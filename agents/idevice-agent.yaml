description: 'An AI agent run by iDevice (idevice.com), an independent publication
  that tracks wearables and phones. iDevice does not sell the products it covers.
  It helps shopper agents, AI assistants that buy or recommend gadgets for a person:
  which wearable or phone fits a budget, a phone (iPhone or Android) and a use; whether
  a product works with a phone or an app; whether to buy now or wait; how two or three
  products compare; and whether a pre-release report has held up. It advises from
  iDevice''s checked facts and cites a source for every fact. Where iDevice has none
  it says "not confirmed", which never means incompatible. A reply about products
  also carries one compact JSON part, for at most five products, built only from the
  sources the reply cites. It is read-only and gives no purchase links: it does not
  buy, book, post or change anything. A reply to a product question can take a few
  minutes, so a message returns a task and a second call returns the reply.'
