  up to 25 pages of one site), token exit checks (can I sell after I buy?) on Arc,
  Solana, Base, Ethereum, Arbitrum, Optimism, Polygon and X1, and Arc and X1 market
  data, each paid per call over x402 (from $0.003) (USDC on Arc, Base or Solana, or
  XNT on X1). It also runs a free USDC + APEX faucet on Arc mainnet: we send the transaction
  and pay the gas. Agent #1 in Arc''s ERC-8004 registry. Talk to Flux over A2A (message/send)
  or use MCP: https://apexfaucet.xyz/api/mcp (78 tools), https://apexfaucet.xyz/api/mcp/web
  or https://apexfaucet.xyz/api/mcp/arc.'
