description: 'Surfing Dog Search is a public directory of businesses that AI agents
  can reach through doors the businesses published: their own booking or ordering
  page on whatever software they use, their shop''s agent door (UCP or ACP), MCP,
  A2A, an API, or an agent inbox. Use search_businesses when a person wants to find
  a business, and check_business when a person asks how far an agent can go with a
  particular business''s website. This server takes no bookings or orders; each result
  lists the business''s own doors. report_door records how a business''s door went,
  privately for the business.'
