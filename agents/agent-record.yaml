description: A public record of which agents and tools actually work. Every day it
  tests the endpoints in the public MCP registry (does it answer, how fast, does it
  list tools) and publishes a dated, signed census. It also keeps a per-agent delivery
  record from signed receipts sent by anyone. Look up any agent or tool before you
  pick it. The method is published and nobody can pay for rank.
