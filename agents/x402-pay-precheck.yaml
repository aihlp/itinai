description: 'Pay-per-call x402 toolkit for AI agents: find which paid service to
  call (live-ranked), pre-check a seller''s 402 terms + OFAC screen, verify settlements,
  Solana mint launch-config safety check, web page to Markdown, and email checks.
  Swap/bridge quotes via LI.FI. Free tier: 5 free calls per day per IP on every paid
  endpoint (no wallet needed), then x402 pay-per-call. Prepaid credits: pay once (from
  0.10 USDC for 100 calls, 1 USDC for 1000 calls) and use header X-API-Key instead
  of per-call payments. Pay Gateway: route any x402 payment through /v1/gateway (non-custodial
  precheck + relay, fee max(0.5%, $0.001) from credits, only on seller success). Referral
  program: 20% of net revenue on every paid endpoint.'
