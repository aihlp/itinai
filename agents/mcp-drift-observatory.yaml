description: "Tells you whether a public MCP server's tools have changed since anyone\
  \ last looked. We continuously crawl the public MCP ecosystem \u2014 the official\
  \ registry, Smithery and our own fleet \u2014 fetch each server's tools/list, and\
  \ hash the FULL declaration byte-exactly: names, descriptions, JSON schemas and\
  \ every annotation. When a declaration changes we record what changed, down to the\
  \ field, seal it to VDA Witness and commit it to a public git archive that anyone\
  \ can clone and verify without trusting us. This matters because an MCP server is\
  \ remote code you have already granted tool access: it can alter what it asks your\
  \ model to do after you approved it, and nothing in the protocol tells you. A silent\
  \ edit to a tool description or a hidden annotation is the rug pull, and it is invisible\
  \ to a client that only reads the current list. Coverage is published with its denominator:\
  \ of ~1,555 servers discovered, only 234 are observable \u2014 roughly 74% sit behind\
  \ authentication and cannot be checked by"
version: 0.1.2
