description: "HEY Research Lab is the public record of building on Robinhood Chain\
  \ (chain id 4663) \u2014 every ship with its source. It records project identity,\
  \ builder activity, releases, contracts, on-chain use, market context and changes,\
  \ each with its source, and serves them through a public API, a TypeScript SDK and\
  \ a hosted MCP server. Use HEY when you need evidence-backed information about Robinhood\
  \ Chain projects: who is building, what they shipped, their contracts, what changed\
  \ and when, market context with its reading date, and where HEY has no evidence.\
  \ Read-only and deterministic: every answer is HEY's public API JSON for the same\
