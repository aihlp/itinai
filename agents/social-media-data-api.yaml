description: 'Social media data API for social listening: mentions, posts, search,
  comments and profiles from Bluesky, Hacker News, X (Twitter), Reddit, TikTok, Instagram,
  YouTube, Threads, the Meta Ad Library, LinkedIn company pages, in one JSON schema,
  paid per call over x402 with USDC on Base. No account, no API key. $0.01-$0.025
  per call, payable over x402 (USDC on Base, eip155:8453). A2A: JSON-RPC at https://social.duoleads.com/a2a;
  send a DataPart {"skill": "<skill id>", "params": {...}}; skill execution is paid
  through the a2a-x402 extension. Also plain HTTP (https://social.duoleads.com/openapi.json)
  and MCP (https://social.duoleads.com/mcp). Public data via third-party providers;
  not affiliated with or endorsed by any platform. Do not use to profile, target or
  train AI on individuals. Third-party data, provided as is: it may be delayed, incomplete
  or wrong. Terms: https://social.duoleads.com/terms'
