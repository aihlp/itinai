description: "Scry is an x402 Solana wallet intelligence API \u2014 pay-per-request\
  \ Solana wallet forensics and funding lineage evidence for agents that need wallet,\
  \ mint, transfer, and cohort context before applying their own monitoring or classification\
  \ policies. Low-cost entry calls start at $0.001 (wallet quick-flag) through $0.01-$0.10\
  \ for bundler checks, mint preflight, Pump.fun cohort screening, and funding lineage\
  \ before deeper dossiers. Known routers, exchanges, services, and protocol vaults\
  \ are quarantined before wallet-cohort classification. Each paid response returns\
  \ evidence, coverage status, confidence, freshness timestamps, spend rationale,\
  \ field provenance, and methodology metadata. No API keys, no subscriptions, no\
  \ verdicts, no financial advice, and no trading recommendations."
