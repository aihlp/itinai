description: 'Perp funding rates, open interest, futures basis, implied volatility,
  liquidations and order book depth across 8 exchanges (Bybit, Hyperliquid, dYdX,
  Gate, Kraken, Bitfinex, Deribit, OKX). $0.003-$0.005 per call, payable over x402
  (USDC on Base, eip155:8453). No account, no API key. A2A: JSON-RPC at https://derivs.duoleads.com/a2a;
  send a DataPart {"skill": "<skill id>", "params": {...}}; skill execution is paid
  through the a2a-x402 extension. Also plain HTTP (https://derivs.duoleads.com/openapi.json)
  and MCP (https://derivs.duoleads.com/mcp). Data only, not investment advice, not
  a benchmark; not affiliated with any exchange.'
