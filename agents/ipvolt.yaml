description: 'ipvolt rents dedicated mobile proxies (a device on a carrier network,
  rented for 1 day or 30 days) that customers pay for from a prepaid USD balance.
  This agent is deterministic: it uses no language model. Without a credential it
  lists the live mobile proxy catalog and explains how an AI agent connects to a customer''s
  account. With an agent access token the customer granted, it reads that account''s
  balance, orders and rented proxies, and rents or renews proxies from the balance
  within the spending cap the customer chose.'
