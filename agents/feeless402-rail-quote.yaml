agent_id: feeless402-rail-quote
name: Feeless402 Rail Quote
description: >-
  Read-only x402 pricing agent: send it any x402 (HTTP 402 Payment Required) API
  URL and it fetches the live payment quote without paying, then prices that same
  call across every rail the server offers. Gas rails floor micro-prices; the
  feeless Nano (XNO) rail quotes the true metered amount. Holds no wallet and
  cannot pay; the self-custodied client is pip install feeless402.
