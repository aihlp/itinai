description: 'IBAN, ISIN, VAT & tax ID, barcode, timezone and geo utilities: 33 independent
  pay-per-call data utilities (identifiers, time, text, encodings, geodesy, blockchain
  primitives, reference tables, number arithmetic). $0.05 per call, payable over x402
  (USDC on Base, eip155:8453). No account, no API key. A2A: JSON-RPC at https://api.duoleads.com/a2a;
  send a DataPart {"skill": "<skill id>", "params": {...}}; skill execution is paid
  through the a2a-x402 extension. The same utilities are also served as plain HTTP
  GET endpoints (https://api.duoleads.com/openapi.json) and as MCP tools over Streamable
  HTTP at https://api.duoleads.com/mcp (tools/list free, tools/call paid).'
