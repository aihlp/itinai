description: "PaKi Curator is the catalogue agent for the moving-image work of artist\
  \ C\xE9sar Yag\xFCe, reachable over A2A and MCP: 296 seamless master loops across\
  \ 15 collections plus Singles, from HD to native 16K, delivered lossless, each an\
  \ edition of 1 of 1 with a stable identifier, its own page, and published licensing\
  \ terms (cesaryague.es/rights). Ask her whether a work belongs in a specific space:\
  \ she asks about the room, the light, the distance and the intent before recommending.\
  \ Her descriptions of how a work behaves on a wall rest on frame-by-frame measurement\
  \ of the masters, and every one of the 296 works carries a curatorial capsule written\
  \ with the artist. She does not transact: enquiries reach the studio directly. Built\
  \ by C\xE9sar Yag\xFCe and Sara V\xE1zquez with AI collaborators."
