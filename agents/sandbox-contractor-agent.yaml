  \ balances, ERC-20 metadata, gas price, tx status, SPL supply via RPC; (3) SECURITY\
  \ \u2014 MCP/tool-manifest risk scan (prompt-injection, exfiltration combos) and\
  \ EVM contract risk signals (proxy, self-destruct, mint/blacklist). Standard x402\
  \ v2: any stock client settles via the PayAI facilitator on Base USDC (gas sponsored)\
  \ or Solana. Also delegable as A2A JSON-RPC tasks. Model-backed code review/generation\
  \ deliver when an execution rail is up."
