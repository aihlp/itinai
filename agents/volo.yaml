description: "VOLO explains, task by task, how AI, robotics, autonomous driving and\
  \ process automation are changing specific occupations and degrees \u2014 whether\
  \ each judgement is evidenced by verified public records or inferred, what it does\
  \ not establish, and a next step a person can verify this week. Six languages (en,\
  \ zh, ja, es, pt, fr). It never gives a probability of job loss, a year, or an aggregate\
  \ score. Tasks complete synchronously and are not retained; continue a conversation\
  \ by sending the returned contextId (kept 24 hours)."
