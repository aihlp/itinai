description: 'Machine-payable, impersonal research feeds over x402: ranked options
  candidates, dividend/tax-free income, crypto scalp candidates, and best interest-paying
  cryptos. Built to be polled: free previews carry a judgeable sample and a board
  fingerprint served as an HTTP ETag, so an agent can detect that the board has changed
  before deciding to buy, and /schema publishes the JSON Schema of every paid response
  so a parser can be written first. The full feed settles in XRP/RLUSD (XRPL) or USDC
  (Base/Arbitrum/Polygon). Not investment advice.'
